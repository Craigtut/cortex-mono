[package]
name = "cortex-sandbox-helper"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
description = "Cortex Windows Tier-1 restricted-token sandbox helper (unelevated). Spawned by @animus-labs/cortex in place of the shell."
license = "MIT"
publish = false

# IMPORTANT: this crate is Windows-only and has NOT been compiled, run, or
# verified. It is a scaffold authored on macOS following the Codex-shipped
# restricted-token recipe (see docs/cortex/windows-sandbox-build.md). The Win32
# call SEQUENCE and flags are the deliverable; the exact `windows`-crate symbol
# names / return-type wrapping may need small adjustments on the first real
# `cargo build --target x86_64-pc-windows-msvc`. Treat every "verified" claim as
# pending that build.

[[bin]]
name = "cortex-sandbox-helper"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The official Microsoft-maintained Win32 bindings. Feature flags gate each
# module tree; enable only what the recipe touches. Pin to a known version and
# bump deliberately (the mitigation-policy and capability-SID surfaces are stable
# across recent releases, but symbol paths occasionally move).
[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemServices",
]

[profile.release]
# A small, self-contained helper. Optimize for size and strip so the shipped
# binary is lean; codesigning happens after the build (see the runbook).
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
