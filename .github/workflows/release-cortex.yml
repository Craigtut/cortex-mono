name: Release Cortex

on:
  push:
    tags:
      - "cortex-v*"

permissions:
  contents: read

env:
  PACKAGE_NAME: "@animus-labs/cortex"
  PACKAGE_DIR: "packages/cortex"
  TAG_PREFIX: "cortex-v"
  NPM_VERSION: "11.18.0"

concurrency:
  group: release-cortex-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm CLI
        run: npm install -g npm@${NPM_VERSION}

      - name: Install dependencies
        run: npm ci

      - name: Validate release metadata
        run: |
          version="$(node -p "require('./${PACKAGE_DIR}/package.json').version")"
          expected_tag="${TAG_PREFIX}${version}"

          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match ${PACKAGE_NAME} version ${version}."
            echo "Expected tag: ${expected_tag}"
            exit 1
          fi

          if ! grep -q "^## ${version}" "${PACKAGE_DIR}/CHANGELOG.md"; then
            echo "${PACKAGE_DIR}/CHANGELOG.md must contain a ## ${version} entry."
            exit 1
          fi

          if npm view "${PACKAGE_NAME}@${version}" version >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${version} is already published."
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck -w packages/cortex

      - name: Build
        run: npm run build -w packages/cortex

      - name: Test
        run: npm run test:run -w packages/cortex

      - name: Pack package
        run: |
          mkdir -p release-artifacts
          npm pack -w packages/cortex --pack-destination release-artifacts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: cortex-package
          path: release-artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7

  stage:
    name: Stage package on npm
    runs-on: ubuntu-latest
    needs: verify
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install npm CLI
        run: npm install -g npm@${NPM_VERSION} --ignore-scripts

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: cortex-package
          path: release-artifacts

      - name: Stage package
        run: |
          tarball_count="$(find release-artifacts -name '*.tgz' | wc -l | tr -d ' ')"
          if [ "${tarball_count}" != "1" ]; then
            echo "Expected exactly one package artifact, found ${tarball_count}."
            exit 1
          fi

          tarball="$(find release-artifacts -name '*.tgz' -print -quit)"
          npm stage publish "${tarball}" --access public
